# Install a licensed frontend adapter implementing docs/backends.md.
stage: live_finetune
backend:
  factory: paup.backends.live:create_task
  frontend_factory: your_backend.paup_adapter:create_frontend
  dataset_factory: your_backend.paup_adapter:create_dataset
  perception_checkpoint: external_paths/checkpoints/perception.pth
  train_root: external_paths/dataset/train
  validation_root: external_paths/dataset/validation
  feature_channels: 128
algorithm:
  communication:
    threshold: 0.05
  uncertainty:
    mode: planning_aware
    weight: 1.0
    max_sigma_px: 12.0
    calibration_path: external_paths/calibration/aoi_sigma.json
  selection:
    request_max_age_ms: 600.0
    waypoint_interval_ms: 200.0
    age_tau_ms: 800.0
    drift_weight: 2.0
    foreground_threshold: 0.1
    extra_fraction: 0.25
    extra_min_cells: 4
    extra_max_cells: 32
training:
  epochs: 10
  batch_size: 1
  workers: 0
  optimizer: AdamW
  learning_rate: 0.00002
  weight_decay: 0.0005
  min_learning_rate: 0.000001
  seed: 42
  output: runs/live_finetune
